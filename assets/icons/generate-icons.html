<!DOCTYPE html>
<!-- Génère les icônes PWA en PNG depuis le navigateur. Ouvre ce fichier dans Chrome/Edge, clique sur "Télécharger", déplace les 3 PNG dans assets/icons/. -->
<html lang="fr"><head><meta charset="utf-8"><title>Génération icônes PWA</title>
<style>body{font-family:sans-serif;background:#0f0f23;color:#fff;padding:20px;text-align:center;}canvas{margin:10px;background:#000;border-radius:8px;}button{padding:10px 20px;background:#6366f1;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:700;}</style>
</head><body>
<h1>🎨 Icônes PWA — SecOps Academy</h1>
<p>Clique sur chaque bouton pour télécharger l'icône. Place les 3 PNG dans <code>assets/icons/</code>.</p>
<div>
  <canvas id="c192" width="192" height="192"></canvas><br>
  <button onclick="dl('c192','icon-192.png')">⬇ icon-192.png</button>
</div>
<div>
  <canvas id="c512" width="512" height="512"></canvas><br>
  <button onclick="dl('c512','icon-512.png')">⬇ icon-512.png</button>
</div>
<div>
  <canvas id="cmask" width="512" height="512"></canvas><br>
  <button onclick="dl('cmask','icon-maskable-512.png')">⬇ icon-maskable-512.png</button>
</div>
<script>
function draw(id, size, maskable) {
  const c = document.getElementById(id), ctx = c.getContext('2d');
  // fond dégradé
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#6366f1'); g.addColorStop(0.5, '#8b5cf6'); g.addColorStop(1, '#06b6d4');
  ctx.fillStyle = g;
  if (maskable) { ctx.fillRect(0, 0, size, size); }
  else {
    const r = size * 0.22;
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(size - r, 0); ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r); ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size); ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.closePath(); ctx.fill();
  }
  // bouclier
  const pad = maskable ? size * 0.22 : size * 0.18;
  const w = size - pad * 2;
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath();
  const cx = size / 2, top = pad, bot = size - pad;
  ctx.moveTo(cx, top);
  ctx.lineTo(size - pad, top + w * 0.15);
  ctx.lineTo(size - pad, top + w * 0.55);
  ctx.quadraticCurveTo(size - pad, bot, cx, bot);
  ctx.quadraticCurveTo(pad, bot, pad, top + w * 0.55);
  ctx.lineTo(pad, top + w * 0.15);
  ctx.closePath(); ctx.fill();
  // texte
  ctx.fillStyle = '#6366f1';
  ctx.font = `900 ${size * 0.28}px Inter, system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('S', cx, size / 2 + size * 0.02);
}
function dl(id, name) {
  const c = document.getElementById(id);
  const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = name; a.click();
}
draw('c192', 192, false);
draw('c512', 512, false);
draw('cmask', 512, true);
</script>
</body></html>
